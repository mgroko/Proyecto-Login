<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="background-gradient"></div>

<div th:if="${param.exito}">
    <div class="alert alert-info">
        Se ha registrado exitosamente.
    </div>
</div>

<div class="card">
    <div class="logo-container">
        <img th:src="@{/imagen/chloe.png}" alt="Logo Chloe" class="logo">
    </div>



    <h2>Registrarse</h2>

    <div class="form-box">
        <form th:action="@{/registro}" th:object="${usuario}" method="post">
            <!--
            <div th:if="${#fields.hasErrors('*')}" style="color: red; font-size: 0.8rem; margin-bottom: 10px;">
                <p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p>
            </div>
            -->
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" style="font-size: 0.8rem;">
                <p th:each="err : ${#fields.errors('*')}" th:text="${err}" style="margin:0;"></p>
            </div>

            <div class="input-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ingrese su nombre" required autofocus = "autofocus">
            </div>

            <div class="input-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" th:field="*{apellido}" placeholder="Ingrese su apellido">
            </div>

            <div class="input-group">
                <label for="username">Nombre de Usuario</label>
                <input type="text" id="username" th:field="*{username}" placeholder="Ingrese su usuario">
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Ingrese su contraseña">
            </div>

            <div class="form-group">
                <button type="submit" class="btn-login">Registrar usuario</button>
            </div>

        </form>
    </div>

    <div class="register-section">
        <p>¿Ya tenés una cuenta? <a th:href="@{/login}">Iniciar sesión</a></p>
    </div>

</div>

</body>
</html>
