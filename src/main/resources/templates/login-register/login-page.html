<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="background-gradient"></div>

<div th:if="${param.exito}" class="alert alert-success alert-flotante" role="alert">
    Iniciaste sesión.
</div>

<div th:if="${param.error}" class="alert alert-danger alert-flotante" role="alert">
    Error al iniciar sesión.
</div>


<div class="card">
    <div class="logo-container">
        <img th:src="@{/imagen/chloe.png}" alt="Logo Chloe" class="logo">
    </div>

    <h2>Inicio de sesión</h2>

    <div class="form-box">
        <form th:action="@{/login}" th:object="${datosLogin}" method="post">

            <div class="input-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" th:field="*{username}" placeholder="Ingrese su usuario">
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Ingrese su contraseña">
            </div>

            <button type="submit" class="btn-login">Iniciar sesión</button>

            <a th:href="@{/olvide-password}" class="forgot-link">Olvidé mi contraseña</a>
        </form>
    </div>

    <div class="register-section">
        <p>¿No tenés una cuenta? <a th:href="@{/registro}">Registrarse</a></p>
    </div>
</div>

</body>
</html>
